# Panel Ankiet — porty 80 i 443 (bloki `server` z include conf.d/www.*.conf).
# Kanoniczny URL: https://inyfinn.synology.me/panel-ankiet/
# Aplikacja Node (Docker) nasłuchuje wyłącznie na 127.0.0.1:3040.
# Instalacja: sh /volume1/web/PANEL\ ANKIET/deploy/install-nginx.sh

location = /panel-ankiet {
    return 301 https://$host/panel-ankiet/$is_args$args;
}
location = /Panel-Ankiet {
    return 301 https://$host/panel-ankiet/$is_args$args;
}
location = /PANEL-ANKIET {
    return 301 https://$host/panel-ankiet/$is_args$args;
}
location = /PANEL-ANKIET/ {
    return 301 https://$host/panel-ankiet/$is_args$args;
}

location ^~ "/PANEL%20ANKIET" {
    return 301 https://$host/panel-ankiet/$is_args$args;
}
location ^~ "/PANEL ANKIET" {
    return 301 https://$host/panel-ankiet/$is_args$args;
}

location ^~ /panel-ankiet/ {
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    proxy_pass http://127.0.0.1:3040/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /panel-ankiet;
    proxy_connect_timeout 60;
    proxy_read_timeout 120;
    proxy_send_timeout 120;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
